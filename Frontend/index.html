      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "FocusFlow AI",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "description": "FocusFlow builds a weekly plan around your real deadlines and calendar, then rebuilds it when anything changes.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free to start"
            },
            "featureList": [
              "Deadline tracking",
              "Automatic re-planning",
              "Focus-time analytics",
              "Overload and burnout detection",
              "Habit-aware scheduling"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is FocusFlow free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "FocusFlow is free to start. If paid tools arrive later, they will be optional and clearly separate from the core planner."
                }
              },
              {
                "@type": "Question",
                "name": "What can I add?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Syllabi, assignment lists, your class schedule, calendar events, and one-off tasks. Upload a PDF or document, paste text, or type things in yourself."
                }
              },
              {
                "@type": "Question",
                "name": "Does it do my work for me?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. FocusFlow organizes and schedules your work. It does not write, complete, or submit coursework."
                }
              },
              {
                "@type": "Question",
                "name": "What happens when I miss something?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The plan recalculates. Unfinished work is moved into the next realistic opening instead of being left behind as a red overdue item."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need to connect Canvas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Start with a syllabus, a screenshot, or a single deadline. Calendar and course connections are optional."
                }
              },
              {
                "@type": "Question",
                "name": "What happens to my data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your schedule and course details are used to build your plan. FocusFlow does not sell your personal data."
                }
              }
            ]
          },
          {
            "@type": "HowTo",
            "name": "Plan your week with FocusFlow",
            "step": [
              {
                "@type": "HowToStep",
                "position": 1,
                "name": "Add your work",
                "text": "Add a syllabus, a deadline, or a single task."
              },
              {
                "@type": "HowToStep",
                "position": 2,
                "name": "Let FocusFlow place it",
                "text": "FocusFlow places the work around your real calendar."
              },
              {
                "@type": "HowToStep",
                "position": 3,
                "name": "Change anything",
                "text": "Change anything and the plan rebuilds itself."
              }
            ]
          }
        ]
      }
    </script>
  </head>

    <div id="root"></div>

  </body>
